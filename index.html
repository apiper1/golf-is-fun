<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golf Is Fun</title>
<meta name="description" content="Golf scorecard for you and your friends. Score with faces or numbers and share a live round code.">
<meta name="theme-color" content="#1e4a2b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a150d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf Is Fun">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Gaegu:wght@700&display=swap">
<script src="config.js"></script>
<style>
/* Layout: one-column phone app. Play one hole at a time, or flip to a vertical card (holes down, players across) so nothing scrolls sideways. */
:root{
  --paper:#eef2ec; --card:#ffffff; --ink:#16261c; --muted:#5f6e64; --line:#cdd9ca;
  --band:#1e4a2b; --band-ink:#ffffff; --band-soft:#dbe6d8;
  --pencil:#2c3a31; --good:#c62f2a; --bad:#3b4a40; --alert:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --hand:"Gaegu","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0a150d; --card:#14261b; --ink:#e8f1e8; --muted:#93a897; --line:#24402e;
  --band:#5a9c69; --band-ink:#0a150d; --band-soft:#1a3121;
  --pencil:#dde8de; --good:#ff6b5e; --bad:#c3d1c6; --alert:#ff8a7e; color-scheme:dark}}

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(32px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--band);outline-offset:2px}
.label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:17px;background:var(--band);color:var(--band-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.seg{display:flex;background:var(--band-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 8px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input[type=text],input[type=date]{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px}

/* Setup */
.hero{padding-block:24px 16px}
.hero h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;margin:0;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--muted)}
.hero .faces{font-size:26px;letter-spacing:4px;margin-bottom:10px}
.form{display:grid;gap:20px}
.field{display:grid;gap:8px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.inline .btn{padding:12px 16px;font-size:16px;flex:none}
.joinbox{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:22px}
.joinbox input{text-transform:uppercase;letter-spacing:.2em;font-family:var(--display);font-size:20px}
.results{display:grid;gap:6px}
.sr{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px}
.sr b{font-weight:600;min-width:0}
.sr small{color:var(--muted);font-size:13px;flex:none;text-align:right}
.sr-msg{color:var(--muted);font-size:14px;padding:4px 2px}
.players{display:grid;gap:10px}
.prow-in{display:flex;gap:10px;align-items:center}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;background:var(--band-soft);color:var(--band)}
.toprow{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.linkbtn{border:0;background:none;color:var(--band);font-weight:600;font-size:15px;padding:8px 0}

/* Play header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:grid;gap:10px}
.barrow{display:flex;align-items:center;gap:8px}
.barrow .title{flex:1;min-width:0;text-align:center}
.barrow .title b{display:block;font-family:var(--display);font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .title span{font-size:13px;color:var(--muted)}
.live{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;color:var(--band)}
.live.off{color:var(--muted)}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.controls{display:flex;gap:8px}
.controls .seg{flex:1}
.controls .seg.small{flex:0 0 112px}
.example{background:var(--band-soft);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px}
.example span{flex:1}
.example button{border:0;background:var(--band);color:var(--band-ink);border-radius:8px;padding:8px 10px;font-weight:600;font-size:14px}

/* Hole view */
.holehead{background:var(--band);color:var(--band-ink);border-radius:18px;padding:14px 10px;display:flex;align-items:center;gap:6px;margin-top:4px}
.holehead .nav{border:0;background:transparent;color:var(--band-ink);font-size:34px;line-height:1;width:48px;height:48px;border-radius:12px}
.holehead .nav:disabled{opacity:.3;cursor:default}
.holehead .mid{flex:1;text-align:center}
.hn{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.parbtn{border:0;margin-top:6px;background:rgba(255,255,255,.18);color:var(--band-ink);border-radius:999px;padding:5px 14px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em}
.rows{display:grid;gap:10px;margin-top:14px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .who small{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tile{flex:none;width:78px;height:78px;border-radius:16px;display:grid;place-items:center;background:var(--band-soft);font-size:50px;line-height:1}
.tile.empty{border:2px dashed var(--line);background:transparent;color:var(--muted);font-size:34px;font-family:var(--display)}
.tile .sc{font-size:38px}
.addp{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:12px;font-weight:600;color:var(--muted);width:100%}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0}
.dot.done{background:var(--band-soft);color:var(--band);border-color:transparent}
.dot.cur{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.footer{display:flex;gap:10px;margin-top:18px}
.footer .btn{flex:1}

/* Score marks (number mode), red for under par like a tour leaderboard: circle birdie, double circle eagle, square bogey, double square double+ */
.sc{font-family:var(--hand);font-weight:700;color:var(--pencil);display:inline-grid;place-items:center;width:1.45em;height:1.45em;line-height:1}
.sc.u{color:var(--good)} .sc.o{color:var(--bad)}
.m-b{border:2px solid currentColor;border-radius:50%}
.m-e{border:2px solid currentColor;border-radius:50%;box-shadow:0 0 0 2px var(--card),0 0 0 4px currentColor}
.m-o{border:2px solid currentColor;border-radius:4px}
.m-d{border:2px solid currentColor;border-radius:4px;box-shadow:0 0 0 2px var(--card),0 0 0 4px currentColor}

/* Card view */
.cardwrap{overflow-x:auto;margin-top:6px;background:var(--card);border:1.5px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
th,td{text-align:center;border-bottom:1px solid var(--line);padding:0;height:52px}
thead th{background:var(--band);color:var(--band-ink);font-family:var(--display);font-weight:600;font-size:15px;height:auto;padding:8px 2px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
thead th small{display:block;font-size:14px;opacity:.85}
th.h,td.h{width:46px;font-family:var(--display);font-weight:700;font-size:18px}
th.p,td.p{width:40px;color:var(--muted);font-family:var(--display);font-size:16px}
thead th.h,thead th.p{color:var(--band-ink)}
td.c button{width:100%;height:52px;border:0;background:transparent;font-size:28px;line-height:1;padding:0}
td.c button .sc{font-size:24px}
td.c .nil{color:var(--line);font-size:20px}
tr.tot td{background:var(--band-soft);font-family:var(--display);font-weight:700;font-size:18px;height:44px}
tr.cur td.h{color:var(--band)}

/* Sheet */
button.title{border:0;background:transparent;padding:4px 6px;border-radius:10px;color:var(--ink)}
.pen{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.xbtn{flex:none;width:46px;height:48px;border:1.5px solid var(--line);background:transparent;border-radius:12px;color:var(--muted)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.warn{color:var(--alert);font-size:14px;margin-top:10px}
.scrim{position:fixed;inset:0;background:rgba(6,20,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;max-width:520px;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0;font-family:var(--display);font-size:24px}
.sheet .sub{color:var(--muted);font-size:14px;margin:2px 0 14px}
.sheet p{line-height:1.45;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 4px 10px;display:grid;justify-items:center;gap:4px}
.opt .e{font-size:44px;line-height:1}
.opt .n{font-family:var(--hand);font-weight:700;font-size:30px;line-height:1;color:var(--pencil)}
.opt .t{font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--band);background:var(--band-soft)}
.sheetfoot{display:flex;gap:10px;margin-top:14px}
.sheetfoot .btn{flex:1;padding:12px}
.bigcode{font-family:var(--display);font-weight:700;font-size:56px;letter-spacing:.14em;text-align:center;color:var(--band);margin:6px 0 4px}
.linkline{font-size:13px;color:var(--muted);text-align:center;word-break:break-all;user-select:all;margin-bottom:6px}

/* History */
.hist{display:grid;gap:12px;margin-top:8px}
.hcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.hcard h3{margin:0;font-family:var(--display);font-size:21px}
.hcard .meta{color:var(--muted);font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--band-soft);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.hact{display:flex;gap:8px;margin-top:12px}
.hact button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.hact .danger{color:var(--alert)}
.emptymsg{color:var(--muted);text-align:center;padding:40px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Faces ---------- */
const FACES = r => r<=-3?['🤯','Albatross']:r===-2?['🤩','Eagle']:r===-1?['😁','Birdie']:r===0?['🙂','Par']:r===1?['😐','Bogey']:r===2?['😬','Double']:r===3?['😩','Triple']:r===4?['😭','Quad']:['💀','+'+r];
const faceFor = (s,par) => s>=9 ? ['☠️','Skull & bones'] : s===8 ? ['⛄','Snowman'] : FACES(s-par);
const DEFAULT9=[4,3,5,4,4,3,5,4,4];

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rl=r=>r===0?'E':r>0?'+'+r:String(r);
const fmtDate=d=>{try{return new Date(d+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch{return d}};
function get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}

function example(){
  return {id:'example',example:true,course:'Example Course',date:today(),holes:9,pars:DEFAULT9.slice(),emoji:true,hole:3,
    players:[{name:'You',scores:[5,3,8,4,null,null,null,null,null]},{name:'Sam',scores:[4,4,5,6,null,null,null,null,null]},{name:'Jordan',scores:[6,2,7,5,null,null,null,null,null]}]};
}

let R = get('ss-current') || example();
let view='play', tab='hole', setupDraft=null, delConfirm=null, histFrom='play';
const save=()=>{ if(!R.example) put('ss-current',R) };

function stats(p){let rel=0,str=0,thru=0;p.scores.forEach((s,i)=>{if(s!=null){rel+=s-R.pars[i];str+=s;thru++}});return{rel,str,thru}}
function mark(score,par){const r=score-par,m=r<=-2?'m-e':r===-1?'m-b':r===1?'m-o':r>=2?'m-d':'';return `<span class="sc ${m} ${r<0?'u':r>0?'o':''}">${score}</span>`}
function show(score,par){return R.emoji?faceFor(score,par)[0]:mark(score,par)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- Live sharing (Firebase Realtime Database) ---------- */
const SDK='https://www.gstatic.com/firebasejs/10.12.2/';
const hasConfig=()=>!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.FIREBASE_CONFIG.databaseURL);
let fbPromise=null, liveRef=null, online=false;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function getDb(){
  if(!hasConfig()) return Promise.reject(new Error('nocfg'));
  if(!fbPromise) fbPromise=(async()=>{
    await loadScript(SDK+'firebase-app-compat.js');
    await Promise.all([loadScript(SDK+'firebase-auth-compat.js'),loadScript(SDK+'firebase-database-compat.js')]);
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    const db=firebase.database();
    db.ref('.info/connected').on('value',s=>{online=!!s.val();updateLive()});
    return db;
  })().catch(e=>{fbPromise=null;throw e});
  return fbPromise;
}
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const mkCode=()=>Array.from({length:6},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
function norm(v){
  const n=v.holes===18?18:9;
  const arr=(src,len,def)=>Array.from({length:len},(_,i)=>src&&src[i]!=null?src[i]:def);
  const pk=v.players?Object.keys(v.players).sort((a,b)=>a-b):[];
  return {id:v.id||String(Date.now()),course:v.course||'My Course',date:v.date||today(),holes:n,pars:arr(v.pars,n,4),
    players:pk.map(k=>({name:(v.players[k]&&v.players[k].name)||'Player',scores:arr(v.players[k]&&v.players[k].scores,n,null)}))};
}
function toRemote(r){return{id:r.id,course:r.course,date:r.date,holes:r.holes,pars:r.pars,players:r.players.map(p=>({name:p.name,scores:p.scores})),createdAt:Date.now()}}
async function connect(code){
  const db=await getDb();
  if(liveRef) liveRef.off();
  liveRef=db.ref('rounds/'+code);
  liveRef.on('value',snap=>{
    const v=snap.val(); if(!v||R.code!==code) return;
    R={...norm(v),code,hole:Math.min(R.hole||0,(v.holes===18?18:9)-1),emoji:R.emoji!==false};
    save(); if(view==='play') render();
  });
}
function disconnect(){ if(liveRef){liveRef.off();liveRef=null} }
function remote(path,val){ if(!R.code) return; getDb().then(db=>db.ref(`rounds/${R.code}/${path}`).set(val)).catch(()=>{}); }
async function startSharing(){
  const db=await getDb(); let code=mkCode();
  for(let i=0;i<5;i++){ const s=await db.ref('rounds/'+code).get(); if(!s.exists()) break; code=mkCode(); }
  await db.ref('rounds/'+code).set(toRemote(R));
  R.code=code; save(); await connect(code);
}
async function joinRound(raw){
  const code=String(raw||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){ toast('Round codes are 6 letters and numbers'); return; }
  if(!hasConfig()){ toast('Sharing is not set up in this copy of the app'); return; }
  toast('Joining '+code+'…');
  try{
    const db=await getDb(); const s=await db.ref('rounds/'+code).get();
    if(!s.exists()){ toast('No round found with code '+code); return; }
    disconnect();
    R={...norm(s.val()),code,hole:0,emoji:R?R.emoji!==false:true};
    save(); tab='hole'; view='play'; render(); window.scrollTo({top:0});
    connect(code); toast('Joined '+code);
  }catch{ toast('Could not join. Check your connection and try again.'); }
}
function updateLive(){const el=document.getElementById('live'); if(el){el.className='live'+(online?'':' off'); el.textContent=(online?'● Live':'○ Offline, will sync')+' · '+R.code}}

/* ---------- Course search (OpenStreetMap) ---------- */
let searchT=null, searchSeq=0;
const setResults=html=>{const el=document.getElementById('courseResults'); if(el) el.innerHTML=html};
const isGolf=r=>r.type==='golf_course'||/golf|country club|links|\bcc\b/i.test(r.name||r.display_name||'');
function resultBtns(list){
  if(!list.length) return '<div class="sr-msg">No courses found. Keep what you typed, or try Courses near me.</div>';
  return list.map(c=>`<button type="button" class="sr" data-a="pick" data-name="${esc(c.name)}"><b>${esc(c.name)}</b><small>${esc(c.where)}</small></button>`).join('');
}
async function nominatim(q){
  const res=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=10&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});
  if(!res.ok) throw new Error('search');
  return (await res.json()).filter(isGolf).map(r=>{const a=r.address||{};return{name:r.name||r.display_name.split(',')[0],where:[a.city||a.town||a.village||a.county,a.state].filter(Boolean).join(', ')}});
}
async function searchCourses(q){
  const seq=++searchSeq; setResults('<div class="sr-msg">Searching…</div>');
  try{
    let list=await nominatim(q);
    if(!list.length&&!/golf/i.test(q)) list=await nominatim(q+' golf');
    if(seq===searchSeq) setResults(resultBtns(list.slice(0,6)));
  }catch{ if(seq===searchSeq) setResults('<div class="sr-msg">Search isn\'t responding right now. You can keep the name you typed.</div>'); }
}
function milesBetween(a,b,c,d){const R0=3958.8,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R0*Math.asin(Math.sqrt(h))}
function withTimeout(url,opts,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t))}
async function overpassNear(la,lo){
  const q=`[out:json][timeout:15];(way["leisure"="golf_course"](around:40000,${la},${lo});relation["leisure"="golf_course"](around:40000,${la},${lo}););out center tags;`;
  const servers=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  for(const url of servers){
    try{
      const res=await withTimeout(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)},12000);
      if(!res.ok) continue;
      const data=await res.json();
      return (data.elements||[]).filter(e=>e.tags&&e.tags.name&&e.center).map(e=>({name:e.tags.name,d:milesBetween(la,lo,e.center.lat,e.center.lon)}));
    }catch{}
  }
  throw new Error('overpass');
}
async function nominatimNear(la,lo){
  const dLat=0.37, dLon=0.37/Math.max(0.2,Math.cos(la*Math.PI/180));
  const vb=[lo-dLon,la+dLat,lo+dLon,la-dLat].map(x=>x.toFixed(4)).join(',');
  const res=await withTimeout('https://nominatim.openstreetmap.org/search?format=jsonv2&bounded=1&limit=25&q=golf%20course&viewbox='+vb,{headers:{Accept:'application/json'}},12000);
  if(!res.ok) throw new Error('nominatim');
  return (await res.json()).filter(r=>r.name).map(r=>({name:r.name,d:milesBetween(la,lo,+r.lat,+r.lon)}));
}
function nearMe(){
  if(!navigator.geolocation){ setResults('<div class="sr-msg">Location isn\'t available on this device.</div>'); return; }
  const seq=++searchSeq; setResults('<div class="sr-msg">Finding courses near you…</div>');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:la,longitude:lo}=pos.coords;
    const got=await Promise.allSettled([overpassNear(la,lo),nominatimNear(la,lo)]);
    if(seq!==searchSeq) return;
    const all=got.filter(g=>g.status==='fulfilled').flatMap(g=>g.value);
    if(!all.length&&got.every(g=>g.status==='rejected')){ setResults('<div class="sr-msg">Nearby search isn\'t responding right now. Try typing the course name.</div>'); return; }
    const seen=new Set();
    const list=all.sort((a,b)=>a.d-b.d).filter(c=>{const k=c.name.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,10).map(c=>({name:c.name,where:c.d.toFixed(1)+' mi'}));
    setResults(resultBtns(list));
  },()=>{ if(seq===searchSeq) setResults('<div class="sr-msg">Location permission is off. Type the course name instead.</div>'); },{timeout:12000,maximumAge:600000});
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  if(a==='close'){ if(e.target===el||el.tagName==='BUTTON') closeSheet(); return; }
  if(a==='set'){
    const pi=+el.dataset.p,h=+el.dataset.h,val=v===''?null:+v;
    R.players[pi].scores[h]=val; save(); remote(`players/${pi}/scores/${h}`,val); closeSheet(); render();
    if(val!=null&&tab==='hole'){ const nxt=R.players.findIndex((p,i)=>i>pi&&p.scores[h]==null); if(nxt>-1) openPad(nxt,h); }
    return;
  }
  if(a==='pad'){ openPad(+el.dataset.p,+el.dataset.h); return; }
  if(a==='go'){ const h=+v; if(h>=0&&h<R.holes){R.hole=h;save();render();window.scrollTo({top:0})} return; }
  if(a==='par'){ const h=R.hole; R.pars[h]=R.pars[h]>=5?3:R.pars[h]+1; save(); remote(`pars/${h}`,R.pars[h]); render(); return; }
  if(a==='tab'){ tab=v; render(); return; }
  if(a==='emoji'){ R.emoji=v==='true'; save(); render(); return; }
  if(a==='new'){ setupDraft={course:'',date:today(),holes:9,players:['','','',''],emoji:R.emoji!==false}; view='setup'; render(); window.scrollTo({top:0}); return; }
  if(a==='resume'){ view='play'; render(); return; }
  if(a==='back'){ view=histFrom; delConfirm=null; render(); return; }
  if(a==='history'){ readDraft(); histFrom=view; view='history'; delConfirm=null; render(); return; }
  if(a==='holes'){ readDraft(); setupDraft.holes=+v; render(); return; }
  if(a==='semoji'){ readDraft(); setupDraft.emoji=v==='true'; render(); return; }
  if(a==='near'){ nearMe(); return; }
  if(a==='pick'){ const c=document.getElementById('course'); c.value=el.dataset.name; setupDraft.course=c.value; setResults(''); searchSeq++; return; }
  if(a==='join'){ joinRound(document.getElementById('joinCode').value); return; }
  if(a==='share'){ openShare(); return; }
  if(a==='nshare'){ navigator.share({title:'Golf Is Fun',text:`Join my round at ${R.course}. Code: ${R.code}`,url:location.origin+location.pathname+'?round='+R.code}).catch(()=>{}); return; }
  if(a==='copy'){ const link=location.origin+location.pathname+'?round='+R.code;
    (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Link copied')).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('shareLink'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Link selected. Copy it from here.')}); return; }
  if(a==='addp'){ openAddPlayer(); return; }
  if(a==='finish'){ finish(); return; }
  if(a==='open'){ const r=(get('ss-history')||[]).find(x=>x.id===el.dataset.id); if(r){disconnect();R=JSON.parse(JSON.stringify(r));delete R.code;R.hole=0;tab='card';save();view='play';render()} return; }
  if(a==='askdel'){ delConfirm=el.dataset.id; render(); return; }
  if(a==='del'){ put('ss-history',(get('ss-history')||[]).filter(x=>x.id!==el.dataset.id)); delConfirm=null; render(); toast('Round deleted'); return; }
});

function applyEdits(){
  const c=document.getElementById('eCourse'), d=document.getElementById('eDate');
  if(c&&c.value.trim()&&c.value.trim()!==R.course){ R.course=c.value.trim(); remote('course',R.course); }
  if(d&&d.value&&d.value!==R.date){ R.date=d.value; remote('date',R.date); }
  R.players.forEach((p,i)=>{ const x=document.getElementById('eP'+i); if(x&&x.value.trim()&&x.value.trim()!==p.name){ p.name=x.value.trim(); remote(`players/${i}/name`,p.name); } });
  const nw=document.getElementById('eNew');
  if(nw&&nw.value.trim()&&R.players.length<6){ const i=R.players.length; R.players.push({name:nw.value.trim(),scores:Array(R.holes).fill(null)}); remote(`players/${i}`,{name:R.players[i].name}); }
  save();

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a;
  if(a==='eadd'){ const nw=document.getElementById('eNew'); if(!nw.value.trim()){ nw.focus(); return; } applyEdits(); render(); openEdit(); const n2=document.getElementById('eNew'); n2&&n2.focus(); }
  if(a==='edit'){ if(R.example){ toast('Start your own round to edit it'); return; } discardArm=false; openEdit(); }
  if(a==='rmp'){ applyEdits(); R.players.splice(+el.dataset.p,1); save(); remote('players',R.players.map(p=>({name:p.name,scores:p.scores}))); render(); openEdit(); }
  if(a==='discard'){
    if(!discardArm){ applyEdits(); discardArm=true; openEdit(); return; }
    discardArm=false; closeSheet(); disconnect(); try{localStorage.removeItem('ss-current')}catch{}
    const em=R.emoji!==false; R=example();
    setupDraft={course:'',date:today(),holes:9,players:['','','',''],emoji:em}; view='setup'; render(); window.scrollTo({top:0}); toast('Round discarded');
  }
});

});

function finish(){
  if(R.example){ toast('Start your own round to save it'); return; }
  const all=get('ss-history')||[], existed=all.some(x=>x.id===R.id), list=all.filter(x=>x.id!==R.id);
  list.unshift(JSON.parse(JSON.stringify({...R,savedAt:Date.now()})));
  toast(put('ss-history',list.slice(0,100))?(existed?'Changes saved to History':'Round saved'):'Could not save on this phone');
}

/* ---------- Boot ---------- */
(function boot(){
  const code=new URLSearchParams(location.search).get('round');
  render();
  if(code){ history.replaceState(null,'',location.pathname); joinRound(code); }
  else if(R.code){ connect(R.code).catch(()=>{}); }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
